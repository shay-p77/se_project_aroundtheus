<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta content="ie=edge" http-equiv="X-UA-Compatible" />
    <title>Around the U.S</title>
    <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon" />
    <!-- Link to your main CSS -->
    <link rel="stylesheet" href="pages/index.css" />
  </head>
  <body class="page">
    <div class="page__content">
      <header class="header page__section">
        <img
          src="images/around-theus.svg"
          alt="logo"
          class="header__logo"
        />
      </header>
      <main class="content">
        <section class="profile page__section">
          <div class="profile__photo-container">
            <img
              src="images/Avatar.jpg"
              alt="profile photo"
              class="profile__photo"
            />
            <button class="profile__photo-button" type="button"></button>
          </div>
          <div class="profile__info">
            <h1 class="profile__title">Jacques Cousteau</h1>
            <button
              class="profile__edit-button"
              id="profile-edit-button"
              type="button"
            ></button>
            <p class="profile__subtitle">Explorer</p>
          </div>
          <button
            class="profile__add-button"
            id="profile-add-button"
            type="button"
          ></button>
        </section>
        <section class="cards page__section">
          <ul class="cards__list"></ul>
        </section>
      </main>

      <footer class="footer page__section">
        <p class="footer__copyright">&copy; 2022 Around The U.S.</p>
      </footer>
    </div>

    <!-- Modals -->
    <div class="modal" id="profile-edit-modal">
      <div class="modal__container">
        <button class="modal__close" id="profile-modal-close" type="button"></button>
        <p class="modal__heading">Edit Profile</p>
        <form class="modal__form">
          <label class="modal__label">
            <input
              class="modal__input"
              id="profile-title-input"
              type="text"
              name="profile-title-input"
              placeholder="Name"
              maxlength="40"
              minlength="2"
              required
            />
            <span class="modal__error" id="profile-title-input-error"></span>
          </label>
          <label class="modal__label">
            <input
              class="modal__input"
              id="profile-subtitle-input"
              type="text"
              name="profile-subtitle-input"
              placeholder="Description"
              maxlength="200"
              minlength="2"
              required
            />
            <span class="modal__error" id="profile-subtitle-input-error"></span>
          </label>
          <button class="modal__button" type="submit">Save</button>
        </form>
      </div>
    </div>

    <div class="modal" id="modal-change-profile-picture">
      <div class="modal__container">
        <button class="modal__close" type="button"></button>
        <p class="modal__heading">Change profile picture</p>
        <form class="modal__form" id="avatar-form">
          <label class="modal__label">
            <input
              type="url"
              class="modal__input"
              id="profile-picture-input"
              name="profile-picture-link"
              placeholder="Image URL"
              required
            />
            <span class="modal__error" id="profile-picture-input-error"></span>
          </label>
          <button class="modal__button" type="submit">Save</button>
        </form>
      </div>
    </div>

    <div class="modal" id="card-add-modal">
      <div class="modal__container">
        <button class="modal__close" id="add-modal-close" type="button"></button>
        <p class="modal__heading">New Place</p>
        <form class="modal__form" id="card-add-form">
          <label class="modal__label">
            <input
              class="modal__input"
              id="card-title-input"
              type="text"
              name="card-title-input"
              placeholder="Title"
              maxlength="30"
              minlength="1"
              required
            />
            <span class="modal__error" id="card-title-input-error"></span>
          </label>
          <label class="modal__label">
            <input
              class="modal__input"
              id="card-link-input"
              type="url"
              name="card-link-input"
              placeholder="Image link"
              required
            />
            <span class="modal__error" id="card-link-input-error"></span>
          </label>
          <button class="modal__button" id="save-card" type="submit">Create</button>
        </form>
      </div>
    </div>

    <div class="modal modal_type_preview" id="js-preview-modal">
      <div class="modal__image-container">
        <button class="modal__close" type="button" id="image-modal-close"></button>
        <img class="modal__preview-image" src="" alt="" />
        <p class="modal__preview-caption" id="modal-image-title"></p>
      </div>
    </div>

    <div class="modal modal__delete-card" id="delete-card-modal">
      <div class="modal__container modal__container-delete">
        <button class="modal__close" id="delete-modal-close" type="button"></button>
        <form class="modal__form">
          <p class="modal__heading">Are you sure?</p>
          <button class="modal__button" id="confirm-delete-button" type="submit">Yes</button>
        </form>
      </div>
    </div>

    <template id="card-template">
      <li class="card" id="card">
        <button class="card__delete-button" type="button" id="card-delete-button"></button>
        <img src="" alt="" class="card__image" />
        <div class="card__description">
          <h2 class="card__title"></h2>
          <button class="card__like-button" type="button"></button>
        </div>
      </li>
    </template>

    <!-- Add your JS if needed -->
    <!-- <script src="pages/index.js" type="module"></script> -->
  </body>
</html>
